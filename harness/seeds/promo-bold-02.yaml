brief: |
  A Nike-style sneaker drop announcement slide. Full-bleed product shot
  at a 30-degree dynamic angle, oversized model name slammed across the
  shoe in italic display type, a small drop date countdown chip in the
  corner. Reads like SNKRS app hero art.
