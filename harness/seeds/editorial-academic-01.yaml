id: editorial-academic-01
style: editorial
useCase: academic
brief: |
  A scholarly slide that reads like a single page from the New York Review of Books — restrained,
  serif-led, deeply legible. Built for ML paper seminars where equations and dense prose share the
  page. The mood is quiet authority: a researcher thinking aloud, not a marketer pitching. Footnotes
  belong here, not bullet points.
constraints:
  - Must accommodate inline math (KaTeX) and 3+ line block quotes without breaking rhythm
  - Citations rendered as superscript with a footer reference list, never as floating boxes
  - Single-column body with a wide outer margin for marginalia / figure callouts
  - No drop shadows, no gradients — typography and whitespace do all the work
inspiration:
  - nyrb
  - edward-tufte-handouts
  - butterick-practical-typography
  - swiss-academic-journals
colorHint: warm ivory background, near-black charcoal text, a single muted oxblood accent for emphasis and rule lines
