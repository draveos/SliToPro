id: brutalist-portfolio-01
style: brutalist
useCase: portfolio
brief: |
  A loud, unapologetic portfolio slide that looks like it was wheat-pasted onto a wall in Berlin.
  Helvetica or a sharp grotesk cranked to 240px, hard-left aligned, daring you to look away. The
  page should feel like it's flipping the viewer off in the most charming way possible — for
  creatives whose work doesn't need to be polite.
constraints:
  - Headline type at 200px+ minimum, allowed to clip the viewport edge
  - No rounded corners anywhere — only sharp 90deg edges and hairline borders
  - Maximum two typefaces; a monospace for metadata is encouraged
  - Intentional misalignment or off-grid placement of at least one element
inspiration:
  - balenciaga-dot-com
  - are-na
  - mid-2010s-zines
  - david-rudnick
colorHint: stark white or raw concrete grey background, pure black type, one violent neon accent (acid green or hazard orange) used aggressively
