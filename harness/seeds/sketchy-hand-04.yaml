id: sketchy-hand-04
category: sketchy-hand
brief: |
  A Procreate-doodle slide for an illustrator's process diary. iPad
  paper texture, a loose pencil sketch in graphite, watercolor wash
  over the sketch, handwritten captions in script, and a date stamp
  in the corner. Personal, intimate, sketchbook-like.
constraints:
  - Subtle iPad paper or watercolor paper texture across the canvas
  - Loose graphite sketch with visible construction lines
  - Watercolor wash with imperfect edges and bleeds
  - Script handwriting for captions
inspiration:
  - procreate-illustration
  - sketchbook-diary
  - watercolor-process
  - illustrator-journal
paletteHint: warm cream paper with graphite gray sketch, soft peach watercolor wash, and warm brown ink script
