id: minimal-corporate-business-01
style: minimal-corporate
useCase: business
brief: |
  A boardroom-grade slide that looks like it came out of a Stripe annual letter — restrained
  sans-serif, a single calm headline, one supporting paragraph, lots of room. Conveys "we are
  the adults" without ever raising its voice. For consulting decks, board updates, and the
  kind of slides where credibility matters more than cleverness.
constraints:
  - Single H1 headline, max 8 words; one supporting paragraph max 40 words
  - Left-aligned text block occupying no more than 55% of canvas width
  - At most one piece of supporting evidence (a logo, a metric, or a small chart)
  - Whitespace is the design — minimum 10% margin on all sides
inspiration:
  - stripe-press
  - linear-marketing
  - mckinsey-quarterly
  - bridgewater-decks
colorHint: pure white background, near-black neutral grey text, one quiet navy or forest-green accent on the headline underline
