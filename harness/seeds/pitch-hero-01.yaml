id: pitch-hero-01
category: pitch-hero
brief: |
  A Y-Combinator-demo-day pitch hero slide. Big problem statement at
  the top in punchy sans, the company name and one-line product
  description centered, a subtle YC orange accent strip across the
  bottom with batch tag and date. Confident, founder-grade.
constraints:
  - Problem statement set as full sentence at top, max two lines
  - Company name in display sans, one-line product description beneath
  - Bottom accent strip with batch label and demo-day date
  - Centered composition with strict vertical symmetry
inspiration:
  - y-combinator
  - demo-day
  - founder-pitch
  - startup-school
paletteHint: warm off-white ground with charcoal type and a single saturated YC-orange accent strip
