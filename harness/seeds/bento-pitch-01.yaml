id: bento-pitch-01
style: bento
useCase: pitch
brief: |
  A bento-grid pitch slide modeled on the Apple Vision Pro keynote pages — modular tiles of
  unequal size, each holding one crisp claim (metric, logo, quote, screenshot). Reads in five
  seconds, leaves an impression of momentum and product polish. For a Series A founder who
  wants the deck to look like the product is already shipping at scale.
constraints:
  - 4-6 tiles in an asymmetric grid; one hero tile must be 2x the area of the smallest
  - Soft 16-20px rounded corners on every tile, subtle inner shadow or 1px border
  - Each tile holds exactly one idea — one number, one logo wall, one screenshot, one quote
  - Consistent inner padding rhythm across tiles (e.g., 32px) even at different sizes
inspiration:
  - apple-vision-pro-page
  - linear-changelog
  - vercel-homepage
  - notion-2024-redesign
colorHint: near-black charcoal canvas with subtly tinted glassy tile surfaces, soft electric-blue and warm-amber accents per tile
