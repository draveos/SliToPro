id: bento-product-01
style: bento
useCase: product
brief: |
  A product feature-tour slide built as a bright bento board — one large hero tile carrying the
  product shot, smaller satellite tiles each calling out a single feature with an icon and a
  one-line benefit. Feels like an Apple product page scrolled into a single frame. Sunny,
  inviting, designed to make the viewer say "oh, I want that."
constraints:
  - Hero product tile occupies ~50% of the canvas; 3-4 feature tiles wrap around it
  - Each feature tile pairs one line-icon with a 4-7 word benefit headline
  - Light mode default; tile surfaces are off-white with very soft pastel tints
  - Rounded 24px corners, generous 40px gutters between tiles
inspiration:
  - apple-product-pages
  - arc-browser-marketing
  - raycast-homepage
  - framer-templates
colorHint: warm cloud-white canvas, pastel mint and peach tile tints, deep navy text for crisp contrast
