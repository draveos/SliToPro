id: minimal-corporate-data-01
style: minimal-corporate
useCase: data
brief: |
  A data-forward slide in the spirit of a Financial Times chart page or a Stripe metrics report
  — one chart given commanding space, a clear title that states the takeaway (not the variable),
  and quiet annotations that point the eye. Designed so that the chart itself is the slide; the
  rest is scaffolding. For analysts who believe a single well-drawn line beats five bullets.
constraints:
  - Chart occupies 60-70% of the canvas; everything else is supporting context
  - Headline must state the conclusion, not describe the axes (e.g., "Revenue tripled in Q3")
  - Data ink only — no gridlines unless functional, no chartjunk, no 3D
  - Source line and date stamp in 10pt grey at the bottom corner
inspiration:
  - financial-times-graphics
  - our-world-in-data
  - tufte-sparklines
  - stripe-press-charts
colorHint: pure white canvas, neutral dark-grey type, one categorical accent color (FT salmon or muted teal) for the primary data series
