id: minimalist-04
category: minimalist
brief: |
  An Apple-website-clean product feature slide. Centered headline in SF
  Pro Display semibold, a one-line subhead, a perfectly silhouetted
  hardware shot, and a cool gradient floor under the device. Feels like
  scrolling apple.com/iphone.
constraints:
  - Centered composition, vertical symmetry strict
  - Headline set in 64-72pt semibold, subhead in 22pt regular
  - Subtle radial gradient ground beneath product, no hard shadow
  - No bullet points, no decoration beyond the device
inspiration:
  - apple-keynote
  - sf-pro-display
  - jony-ive
  - apple-marketing-site
paletteHint: cool white background with deep slate headline and a subtle silver-blue gradient under the product
