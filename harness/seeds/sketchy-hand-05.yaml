id: sketchy-hand-05
category: sketchy-hand
brief: |
  A marker-on-butcher-paper brainstorm wall slide. Tan kraft paper
  background with thick Sharpie strokes spelling out a meeting topic,
  multi-color sticky notes affixed to the paper, and clusters of
  arrows showing themes. Design-thinking workshop energy.
constraints:
  - Kraft tan paper background with subtle fiber texture
  - Topic title in thick black Sharpie strokes
  - At least four colored sticky notes scattered with handwritten labels
  - Marker arrows linking sticky-note clusters
inspiration:
  - design-thinking-workshop
  - butcher-paper
  - sticky-note-brainstorm
  - ideo-workshop
paletteHint: kraft tan ground with black Sharpie type and sticky notes in pastel pink, mint, yellow, and lavender
