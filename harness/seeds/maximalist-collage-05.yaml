id: maximalist-collage-05
category: maximalist-collage
brief: |
  A 2014-Tumblr-collage moodboard slide for a fashion mood research
  page. Soft-grain JPEG photos overlapping, scribbled captions in
  glittery script, sparkle GIFs as static stars, and a pastel
  tiled background. Intentionally lo-fi and emotional.
constraints:
  - Six or more overlapping photo cutouts at gentle rotations
  - At least two captions in handwritten or script type
  - Static "sparkle" graphic elements scattered like stars
  - Subtle tiled or repeating soft pattern as background
inspiration:
  - tumblr-2014
  - moodboard-collage
  - fashion-research
  - dreamy-grunge
paletteHint: dusty lavender tiled ground with soft pinks, cream photos, and glittery silver script
